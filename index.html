<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17191b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ahmed Tapisserie — Gestion d'atelier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#29251f;--panel:#393228;--panel2:#453b2e;--line:#655640;--text:#fff8e9;--muted:#c9bda8;--yellow:#f5c842;--orange:#f28c28;--gold:#e9b95a;--danger:#ff8580;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#5a4226 0,transparent 42%),var(--bg);color:var(--text);font:14px Manrope,system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,54px);position:sticky;top:0;background:#29251ff2;backdrop-filter:blur(16px);z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}.mark{width:38px;height:38px;border:1px solid var(--yellow);border-radius:11px;display:grid;place-items:center;color:var(--yellow);font-weight:800;background:#40372a}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;margin-top:3px}.header-actions{display:flex;gap:10px;align-items:center}
main{max-width:1240px;margin:0 auto;padding:32px clamp(16px,4vw,48px) 80px}
.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}.page-title{font-size:clamp(27px,4vw,42px);margin:8px 0 6px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0 0 25px}
.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.nav button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px 16px;font-weight:700;transition:background .18s,border-color .18s,transform .18s}
.nav button:hover,.btn:hover{border-color:var(--yellow);transform:translateY(-1px)}.nav button.active{background:var(--yellow);color:#29251f;border-color:var(--yellow)}
.btn.primary{background:var(--yellow);color:#29251f;border-color:var(--yellow)}.btn.gold{background:#4a3825;border-color:var(--orange);color:#ffc16f}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat,.panel,.item{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px #120e091f}
.stat{padding:18px}.stat small{color:var(--muted);display:block;margin-bottom:10px}.stat strong{font-size:27px;letter-spacing:-.04em}.stat em{font-style:normal;color:var(--yellow);font-size:11px;margin-left:6px}
.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:17px;margin:0}.muted{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px;font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);background:#211e19;color:var(--text);border-radius:10px;padding:12px 13px;min-height:44px;outline:none}
input::placeholder,textarea::placeholder{color:#a99c86}input:focus,select:focus,textarea:focus{border-color:var(--yellow);box-shadow:0 0 0 3px #f5c84224}textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:360px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{padding:16px;min-width:0}.item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0 0 7px;font-size:16px;overflow-wrap:anywhere}.item p{margin:5px 0;color:var(--muted);font-size:12px}
.tag{font-size:10px;border:1px solid #b18b37;color:#ffd86b;background:#594725;padding:5px 8px;border-radius:999px;white-space:nowrap}.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.item-actions button{padding:8px 10px;font-size:11px}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
.notice{padding:12px 14px;border-radius:10px;background:#4b3824;color:#ffd18c;border:1px solid #805526;font-size:12px;margin:12px 0}
.login{max-width:430px;margin:12vh auto;padding:26px}.login .field{margin:12px 0}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--yellow);color:#29251f;border-radius:12px;font-weight:800;z-index:20;display:none;max-width:90vw}#paper{display:none}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}}
@media(max-width:520px){header{height:62px}.brand{font-size:12px}.mark{width:33px;height:33px}main{padding-top:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:15px}.stat{padding:14px}.stat strong{font-size:22px}.header-actions .muted{display:none}}
@page{size:auto;margin:12mm}
@media print{html,body{background:#fff!important;color:#111!important;min-height:0!important}body *{visibility:hidden!important}#paper,#paper *{visibility:visible!important}#paper{display:block!important;position:absolute!important;inset:0 auto auto 0!important;width:100%!important;color:#111!important;background:#fff!important;padding:0!important;font:12pt Arial,sans-serif!important}#paper h1{font-size:20pt}#paper table{width:100%;border-collapse:collapse;margin-top:20px}#paper td{border:1px solid #aaa;padding:9px}#paper .sign{display:flex;justify-content:space-between;margin-top:65px}}
.section-label{color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:.08em;padding:8px 0;border-bottom:1px solid var(--line)}.balance-preview{background:#453b2e;border:1px solid var(--line);border-radius:12px;padding:15px;display:grid;gap:6px}.balance-preview span,.balance-preview small{color:var(--muted)}.balance-preview strong{color:var(--yellow);font-size:24px}.client-list-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}.client-number{color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:7px}.client-card-metrics{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:11px;margin-top:10px;font-size:11px;color:var(--muted)}.client-card-metrics b{display:block;color:var(--text);font-size:13px;margin-top:4px}.gold-text{color:var(--yellow)!important}.client-detail-name{font-size:28px;margin:8px 0}.detail-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.detail-stats>div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}.detail-stats small{display:block;color:var(--muted);margin-bottom:8px}.detail-stats strong{font-size:14px;overflow-wrap:anywhere}.schedule-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.schedule-row:last-child{border:0}.schedule-row small{display:block;color:var(--muted);margin-bottom:6px}.schedule-row strong{font-size:13px}@media(max-width:600px){.detail-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.schedule-row{grid-template-columns:1fr}.client-card-metrics{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="auth"></div>
<div id="app" class="hidden"></div>
<div id="paper"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// Configure only with the NEW dedicated Atelier-Ahmed Supabase project.
// Never place a database password, service-role key, or secret key in this file.
const SB_URL='https://mzypeotwjtadyirneawf.supabase.co';
const SB_KEY='sb_publishable_qiJRSkpSTdKDRvIITYsoKQ_8FBsvqA_';
const CONFIGURED=true;
const db=CONFIGURED?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('fr-FR'):'—';
const amount=v=>Number(v||0).toLocaleString('fr-TN',{minimumFractionDigits:3,maximumFractionDigits:3})+' TND';
const statusLabels={pending:'En attente',progress:'Reçu à l’atelier',done:'Terminé',delivered:'Livré'};
let session=null,role='tv',clients=[],projects=[],appointments=[],active='dashboard',query='',statusFilter='',selectedClientId=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function authView(){ $('#auth').innerHTML='<form class="panel login" id="login"><div class="eyebrow">AHMED TAPISSERIE</div><h1>Gestion d’atelier</h1><p class="muted">Connectez-vous pour accéder à votre espace.</p><div class="field"><label>Adresse e-mail</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Mot de passe</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%">Se connecter</button><p id="auth-error" class="muted"></p></form>';
$('#login').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const {error}=await db.auth.signInWithPassword(f);if(error)$('#auth-error').textContent='Connexion impossible. Vérifiez vos identifiants.';else await boot();};}
async function boot(){if(!CONFIGURED){$('#auth').innerHTML='<div class="panel login"><div class="eyebrow">AHMED TAPISSERIE</div><h1>Configuration requise</h1><p class="muted">L’application attend l’URL et la clé publique du nouveau projet Supabase dédié à Atelier Ahmed. Aucune connexion à l’ancienne base ne sera effectuée.</p></div>';return}const s=await db.auth.getSession();session=s.data.session;if(!session){$('#app').classList.add('hidden');authView();return}
const p=await db.from('profiles').select('role').eq('id',session.user.id).single();role=p.data?.role||'tv';
if(!['admin','worker'].includes(role)){await db.auth.signOut();$('#auth').innerHTML='<div class="panel login"><h2>Accès non autorisé</h2><p class="muted">Ce compte n’a pas de rôle de gestionnaire d’atelier.</p><button class="btn" onclick="location.reload()">Retour</button></div>';return}
$('#auth').innerHTML='';$('#app').classList.remove('hidden');await reload();render();}
async function reload(){const [c,p,a]=await Promise.all([db.from('clients').select('*').order('created_at',{ascending:false}),db.from('projects').select('*').order('created_at',{ascending:false}),db.from('appointments').select('*').order('appointment_date',{ascending:true})]);const err=c.error||p.error||a.error;if(err){toast('Erreur de chargement : '+err.message);return}clients=c.data||[];projects=p.data||[];appointments=a.data||[];}
function clientName(id){return clients.find(c=>c.id===id)?.name||'Client introuvable'}
function clientNumber(c){return String(c?.client_number??'—').padStart(3,'0')}
function shell(){return '<header><div class="brand"><div class="mark">AH</div><div>AHMED TAPISSERIE<small>GESTION D’ATELIER</small></div></div><div class="header-actions"><span class="muted">'+esc(session.user.email)+'</span><button class="btn" id="logout">Déconnexion</button></div></header><main class="app-shell"><div class="eyebrow">ESPACE PROFESSIONNEL</div><h1 class="page-title">Votre atelier, parfaitement organisé.</h1><p class="sub">Clients, commandes et projets — au même endroit.</p><nav class="nav">'+[['dashboard','Vue d’ensemble'],['clients','Clients'],['appointments','Rendez-vous'],['projects','Projets']].map(([k,v])=>'<button data-tab="'+k+'" class="'+(active===k?'active':'')+'">'+v+'</button>').join('')+'</nav><section id="view"></section></main>'}
function render(){ $('#app').innerHTML=shell();$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;query='';render()});view();}
function view(){const el=$('#view');if(active==='dashboard')el.innerHTML=dashboard();if(active==='clients')el.innerHTML=clientsView();if(active==='appointments')el.innerHTML=appointmentsView();if(active==='client-detail')el.innerHTML=clientDetailView();if(active==='projects')el.innerHTML=projectsView();wire();}
function dashboard(){const due=projects.filter(p=>p.status!=='delivered').length,unpaid=projects.reduce((s,p)=>s+Math.max(0,Number(p.final_price)-Number(p.deposit)),0),pickups=projects.filter(p=>p.pickup_date&&p.pickup_date>=new Date().toISOString().slice(0,10)).length;return '<div class="grid"><div class="stat"><small>Clients enregistrés</small><strong>'+clients.length+'</strong><em>CLIENTS</em></div><div class="stat"><small>Projets en cours</small><strong>'+due+'</strong><em>ATELIER</em></div><div class="stat"><small>Collectes à venir</small><strong>'+pickups+'</strong><em>RÉCUPÉRATION</em></div><div class="stat"><small>Solde restant des projets</small><strong style="font-size:20px">'+amount(unpaid)+'</strong></div></div><div class="panel"><div class="panel-head"><h2>Derniers projets</h2><button class="btn" data-go="projects">Voir les projets</button></div>'+projects.slice(0,4).map(projectCard).join('')+(projects.length?'':'<div class="empty">Aucun projet enregistré pour le moment.</div>')+'</div>'}
function clientsView(){
 const activeClients=clients.filter(c=>c.is_active!==false);const filtered=activeClients.filter(c=>(String(c.client_number||'')+' '+c.name+' '+(c.phone||'')).toLocaleLowerCase().includes(query.toLocaleLowerCase()));
 return '<div class="panel"><div class="panel-head"><h2>Ajouter un client</h2><span class="tag">CLIENT + COMMANDE</span></div><form id="client-form" class="form-grid">'+
 '<div class="field"><label>Nom et prénom *</label><input name="name" required maxlength="180" placeholder="Nom exact du client"></div>'+
 '<div class="field"><label>Téléphone</label><input name="phone" type="tel"></div><div class="field"><label>Adresse</label><input name="address"></div><div class="field"><label>E-mail (facultatif)</label><input name="email" type="email"></div>'+
 '<div class="field"><label>Source du client</label><select name="source"><option value="">Sélectionner la source</option><option>Facebook</option><option>WhatsApp</option><option>Google</option><option>Passage / Hasard</option><option>Recommandation</option><option>Autre</option></select></div>'+
 '<div class="field"><label>Travail / meuble (provisoire)</label><input name="service" placeholder="Salon, canapé, fauteuil..."></div>'+
 '<div class="field full"><div class="section-label">01 — RÉCUPÉRATION DU SALON CHEZ LE CLIENT</div></div><div class="field"><label>Date de récupération *</label><input name="pickup_date" type="date" required></div><div class="field"><label>Heure de récupération *</label><input name="pickup_time" type="time" required></div>'+
 '<div class="field full"><div class="section-label">02 — DISPONIBILITÉ DU SALON POUR LE CLIENT</div></div><div class="field"><label>Date de disponibilité prévue *</label><input name="ready_date" type="date" required></div><div class="field"><label>Heure de disponibilité prévue *</label><input name="ready_time" type="time" required></div>'+
 '<div class="field full"><div class="section-label">03 — INFORMATIONS FINANCIÈRES</div></div><div class="field"><label>Prix total (TND) *</label><input name="final_price" type="number" min="0" step=".001" required></div><div class="field"><label>Avance / acompte (TND) *</label><input name="deposit" type="number" min="0" step=".001" value="0" required></div>'+
 '<div class="field full"><div class="balance-preview"><span>Solde restant à payer</span><strong id="client-balance">0,000 TND</strong><small>Calcul automatique : prix total − acompte</small></div></div>'+
 '<div class="field full"><label>Notes internes (non visibles sur le PDF)</label><textarea name="internal_notes" placeholder="Informations réservées à l’atelier..."></textarea></div><div class="field full"><button class="btn primary" type="submit">Enregistrer le client et sa commande</button></div></form><div class="notice">Le numéro client est attribué automatiquement. Les deux dates et heures apparaissent sur le PDF envoyé au client.</div></div>'+
 '<div class="toolbar"><input id="search" placeholder="Rechercher par N°, nom ou téléphone..." value="'+esc(query)+'"></div><div class="client-list-head"><strong>Clients enregistrés</strong><span class="muted">'+filtered.length+' / '+activeClients.length+'</span></div><div class="list">'+filtered.map(clientCard).join('')+(filtered.length?'':'<div class="empty">Aucun client correspondant.</div>')+'</div>';
}
function clientCard(c){
 const ps=projects.filter(p=>p.client_id===c.id),total=ps.reduce((n,p)=>n+Number(p.final_price||0),0),balance=ps.reduce((n,p)=>n+Math.max(0,Number(p.final_price||0)-Number(p.deposit||0)),0),latest=ps[0];
 return '<article class="item client-item"><div class="item-top"><div><div class="client-number">CLIENT N° '+clientNumber(c)+'</div><h3>'+esc(c.name)+'</h3></div><span class="tag">'+(latest?esc(statusLabels[latest.status]||latest.status):'Client')+'</span></div><p>'+esc(c.phone||'Téléphone non renseigné')+' · '+esc(c.address||'Adresse non renseignée')+'</p><div class="client-card-metrics"><span>Prix total <b>'+amount(total)+'</b></span><span>Solde <b class="gold-text">'+amount(balance)+'</b></span></div><div class="item-actions"><button class="btn primary" data-client-open="'+c.id+'">Consulter le client</button><button class="btn gold" data-client-pdf="'+c.id+'">PDF</button></div></article>';
}
function clientDetailView(){
 const c=clients.find(x=>x.id===selectedClientId);if(!c)return '<div class="panel"><p>Client introuvable.</p><button class="btn" data-back-clients>Retour aux clients</button></div>';
 const ps=projects.filter(p=>p.client_id===c.id),total=ps.reduce((n,p)=>n+Number(p.final_price||0),0),deposit=ps.reduce((n,p)=>n+Number(p.deposit||0),0),balance=ps.reduce((n,p)=>n+Math.max(0,Number(p.final_price||0)-Number(p.deposit||0)),0);
 return '<div class="panel"><div class="panel-head"><button class="btn" data-back-clients>← Liste des clients</button><span class="tag">CLIENT N° '+clientNumber(c)+'</span></div><h2 class="client-detail-name">'+esc(c.name)+'</h2><p class="muted">'+esc(c.phone||'Téléphone non renseigné')+' · '+esc(c.address||'Adresse non renseignée')+'</p><div class="detail-stats"><div><small>Projets</small><strong>'+ps.length+'</strong></div><div><small>Prix total</small><strong>'+amount(total)+'</strong></div><div><small>Avances</small><strong>'+amount(deposit)+'</strong></div><div><small>Solde restant</small><strong class="gold-text">'+amount(balance)+'</strong></div></div><div class="item-actions"><button class="btn primary" data-client-pdf="'+c.id+'">Télécharger la fiche PDF</button><button class="btn gold" data-client-share="'+c.id+'">Partager sur WhatsApp</button><button class="btn" data-client-print="'+c.id+'">Imprimer (optionnel)</button></div></div>'+
 '<div class="panel"><div class="panel-head"><h2>Dates prévues</h2><span class="tag">RENDEZ-VOUS CLIENT</span></div>'+ps.map(p=>'<div class="schedule-row"><div><small>Récupération du salon</small><strong>'+date(p.pickup_date)+' · '+esc(p.pickup_time||'—')+'</strong></div><div><small>Salon disponible</small><strong>'+date(p.due_date)+' · '+esc(p.ready_time||'—')+'</strong></div></div>').join('')+'</div>'+
 '<div class="panel"><div class="panel-head"><h2>Commandes et projets</h2><span class="tag">'+ps.length+' dossier(s)</span></div>'+ps.map(projectCard).join('')+(ps.length?'':'<div class="empty">Aucune commande enregistrée.</div>')+'</div>'+
 '<div class="panel"><h2>Informations internes</h2><p><b>Source :</b> '+esc(c.source||'Non renseignée')+'</p><p><b>Notes :</b> '+esc(c.notes||'Aucune note interne')+'</p></div>';
}
function clientOptions(selected){return '<option value="">Sélectionner un client</option>'+clients.filter(c=>c.is_active!==false).map(c=>'<option value="'+c.id+'" '+(selected===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')}
function appointmentsView(){
 const prospects=appointments.map(a=>({a,c:clients.find(c=>c.id===a.client_id)}));
 return '<div class="panel"><div class="panel-head"><h2>Nouveau contact / rendez-vous</h2><span class="tag">SANS PROJET</span></div><form id="appointment-form" class="form-grid"><div class="field"><label>Nom et prénom *</label><input name="name" required maxlength="180" placeholder="Nom exact du contact"></div><div class="field"><label>Téléphone</label><input name="phone" type="tel"></div><div class="field"><label>Source</label><select name="source"><option value="">Sélectionner la source</option><option>Facebook</option><option>WhatsApp</option><option>Google</option><option>Passage / Hasard</option><option>Recommandation</option><option>Autre</option></select></div><div class="field"><label>Date du rendez-vous *</label><input name="appointment_date" type="date" required></div><div class="field"><label>Heure</label><input name="appointment_time" type="time"></div><div class="field full"><label>Notes initiales</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary">Enregistrer le contact et le rendez-vous</button></div></form><div class="notice">Aucun projet ni prix n’est créé à cette étape. La conversion se fait uniquement à l’arrivée du client à l’atelier.</div></div><div class="client-list-head"><strong>Contacts et rendez-vous</strong><span class="muted">'+prospects.length+' rendez-vous</span></div><div class="list">'+prospects.map(({a,c})=>'<article class="item"><div class="item-top"><div><div class="client-number">CONTACT N° '+clientNumber(c)+'</div><h3>'+esc(c?.name||'Contact introuvable')+'</h3></div><span class="tag">'+date(a.appointment_date)+'</span></div><p>'+esc(c?.phone||'Téléphone non renseigné')+' · '+esc(c?.source||'Source non renseignée')+'</p><p>Heure : '+esc(a.appointment_time||'À définir')+'</p><p>'+esc(a.notes||'')+'</p>'+(c?.is_active===false?'<form class="convert-form form-grid" data-convert="'+c.id+'"><div class="field full"><div class="section-label">ARRIVÉE DU CLIENT — CRÉER LE PROJET</div></div><div class="field"><label>Travail / meuble *</label><input name="service" required placeholder="Ex. Réfection d’un salon"></div><div class="field"><label>Date de récupération *</label><input name="pickup_date" type="date" required></div><div class="field"><label>Heure de récupération *</label><input name="pickup_time" type="time" required></div><div class="field"><label>Date de disponibilité *</label><input name="ready_date" type="date" required></div><div class="field"><label>Heure de disponibilité *</label><input name="ready_time" type="time" required></div><div class="field"><label>Prix total (TND) *</label><input name="final_price" type="number" min="0" step=".001" required></div><div class="field"><label>Avance / acompte (TND) *</label><input name="deposit" type="number" min="0" step=".001" value="0" required></div><div class="field full"><div class="balance-preview"><span>Solde restant à payer</span><strong class="convert-balance">0,000 TND</strong></div></div><div class="field full"><label>Notes du projet</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary" type="submit">Convertir en client et créer un projet</button></div></form>':'<div class="notice">Ce contact est déjà client. Son projet est visible dans la fiche client.</div>')+'<div class="item-actions"><button class="btn gold" data-print-appointment="'+a.id+'">Imprimer le rendez-vous</button></div></article>').join('')+(appointments.length?'':'<div class="empty">Aucun rendez-vous planifié.</div>')+'</div>';
}
function projectsView(){return '<div class="panel"><div class="panel-head"><h2>Enregistrer l’arrivée d’un salon</h2><span class="tag">NOUVEAU PROJET</span></div><div class="notice">Un projet est créé uniquement lorsque le meuble arrive réellement à l’atelier.</div>'+(clients.length?'':'<div class="notice">Ajoutez d’abord un client.</div>')+'<form id="project-form" class="form-grid"><div class="field"><label>Client *</label><select name="client_id" required>'+clientOptions()+'</select></div><div class="field"><label>Service / type de meuble *</label><input name="service" required placeholder="Ex. Réfection d’un salon"></div><div class="field"><label>Date de réception à l’atelier *</label><input name="start_date" type="date" required></div><div class="field"><label>Date de livraison prévue</label><input name="due_date" type="date"></div><div class="field"><label>Prix final (TND) *</label><input name="final_price" type="number" min="0" step=".001" required></div><div class="field"><label>Avance / acompte (TND)</label><input name="deposit" type="number" min="0" step=".001" value="0"></div><div class="field full"><label>Notes et détails</label><textarea name="notes"></textarea></div><div class="field full"><button class="btn primary" '+(!clients.length?'disabled':'')+'>Créer le projet</button></div></form></div><div class="toolbar"><input id="search" placeholder="Rechercher un projet..." value="'+esc(query)+'"><select id="status-filter"><option value="">Tous les statuts</option>'+Object.entries(statusLabels).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></div><div id="project-list" class="list">'+projects.filter(p=>(!statusFilter||p.status===statusFilter)&&(clientName(p.client_id)+' '+(p.service||'')).toLocaleLowerCase().includes(query.toLocaleLowerCase())).map(projectCard).join('')+(projects.length?'':'<div class="empty">Aucun projet enregistré.</div>')+'</div>'}
function projectCard(p){return '<article class="item"><div class="item-top"><h3>'+esc(clientName(p.client_id))+'</h3><span class="tag">'+esc(statusLabels[p.status]||p.status)+'</span></div><p>'+esc(p.service||'Service non précisé')+'</p><p>Récupération : '+date(p.pickup_date)+' · '+esc(p.pickup_time||'—')+'</p><p>Disponible : '+date(p.due_date)+' · '+esc(p.ready_time||'—')+'</p><p>Réception atelier : '+date(p.start_date)+'</p><p>Prix : '+amount(p.final_price)+' · Acompte : '+amount(p.deposit)+' · Solde : '+amount(Number(p.final_price)-Number(p.deposit))+'</p><div class="item-actions"><select data-status="'+p.id+'" aria-label="Statut du projet">'+Object.entries(statusLabels).map(([k,v])=>'<option value="'+k+'" '+(p.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="btn gold" data-print-project="'+p.id+'">Fiche projet</button><button class="btn" data-details="'+p.id+'">Mesures & photos</button></div><div id="details-'+p.id+'" class="panel hidden" style="margin-top:14px"><div class="muted">Chargement des détails…</div></div></article>'}
function wire(){const af=$('#appointment-form');if(af)af.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(af));const {data,error}=await db.rpc('create_contact_with_appointment',{p_name:f.name,p_phone:f.phone||null,p_source:f.source||null,p_appointment_date:f.appointment_date,p_appointment_time:f.appointment_time||null,p_notes:f.notes||null});if(error)return toast('Enregistrement impossible : '+error.message);toast('Contact et rendez-vous enregistrés');await reload();view()};
document.querySelectorAll('[data-convert]').forEach(form=>{const price=form.elements.final_price,deposit=form.elements.deposit,balance=form.querySelector('.convert-balance');const update=()=>balance.textContent=amount(Math.max(0,Number(price.value||0)-Number(deposit.value||0)));price.oninput=update;deposit.oninput=update;update();form.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form)),p=Number(f.final_price),d=Number(f.deposit);if(p<0||d<0||d>p)return toast('Vérifiez le prix total et l’acompte.');if(new Date(f.ready_date+'T'+f.ready_time)<new Date(f.pickup_date+'T'+f.pickup_time))return toast('La disponibilité doit être après la récupération.');const {error}=await db.rpc('convert_contact_to_project',{p_client_id:form.dataset.convert,p_service:f.service,p_pickup_date:f.pickup_date,p_pickup_time:f.pickup_time,p_ready_date:f.ready_date,p_ready_time:f.ready_time,p_final_price:p,p_deposit:d,p_notes:f.notes||null});if(error)return toast('Conversion impossible : '+error.message);toast('Le contact est devenu client et son projet a été créé');await reload();active='clients';render();}});
const cf=$('#client-form');if(cf){const price=cf.elements.final_price,deposit=cf.elements.deposit,balance=$('#client-balance');const updateBalance=()=>{const p=Number(price.value||0),d=Number(deposit.value||0);balance.textContent=amount(Math.max(0,p-d));};price.oninput=updateBalance;deposit.oninput=updateBalance;updateBalance();cf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(cf)),priceValue=Number(f.final_price),depositValue=Number(f.deposit);if(!f.name.trim())return toast('Le nom du client est obligatoire.');if(depositValue<0||priceValue<0||depositValue>priceValue)return toast('L’acompte doit être compris entre zéro et le prix total.');if(new Date(f.ready_date+'T'+f.ready_time)<new Date(f.pickup_date+'T'+f.pickup_time))return toast('La date de disponibilité doit être après la récupération.');const {data,error}=await db.rpc('create_client_with_project',{p_name:f.name,p_phone:f.phone||null,p_address:f.address||null,p_email:f.email||null,p_source:f.source||null,p_internal_notes:f.internal_notes||null,p_service:f.service||'Travail à définir',p_pickup_date:f.pickup_date,p_pickup_time:f.pickup_time,p_ready_date:f.ready_date,p_ready_time:f.ready_time,p_final_price:priceValue,p_deposit:depositValue});if(error)return toast('Enregistrement impossible : '+error.message);const created=Array.isArray(data)?data[0]:data;toast('Client N° '+String(created?.client_number??'').padStart(3,'0')+' enregistré');query='';await reload();active='client-detail';selectedClientId=created?.client_id||null;render();}}
const search=$('#search');if(search)search.oninput=()=>{query=search.value;const pos=search.selectionStart;view();const n=$('#search');n.focus();n.setSelectionRange(pos,pos)};
const statusSelect=$('#status-filter');if(statusSelect)statusSelect.onchange=()=>{statusFilter=statusSelect.value;view()};
document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('projects').update({status:s.value}).eq('id',s.dataset.status);if(error)return toast('Mise à jour impossible : '+error.message);await reload();view();toast('Statut mis à jour')});
document.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>showProjectDetails(b.dataset.details));
document.querySelectorAll('[data-client-open]').forEach(b=>b.onclick=()=>{selectedClientId=b.dataset.clientOpen;active='client-detail';render()});
document.querySelectorAll('[data-back-clients]').forEach(b=>b.onclick=()=>{active='clients';render()});
document.querySelectorAll('[data-client-pdf]').forEach(b=>b.onclick=()=>downloadClientPdf(b.dataset.clientPdf));
document.querySelectorAll('[data-client-share]').forEach(b=>b.onclick=()=>shareClientPdf(b.dataset.clientShare));
document.querySelectorAll('[data-client-print]').forEach(b=>b.onclick=()=>printClient(b.dataset.clientPrint));
document.querySelectorAll('[data-print-project]').forEach(b=>b.onclick=()=>printProject(b.dataset.printProject));
document.querySelectorAll('[data-print-appointment]').forEach(b=>b.onclick=()=>printAppointment(b.dataset.printAppointment));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{active=b.dataset.go;render()});
}

async function showProjectDetails(id){
 const box=$('#details-'+id);if(!box)return;box.classList.remove('hidden');
 const [m,p]=await Promise.all([db.from('project_measurements').select('*').eq('project_id',id).order('created_at'),db.from('project_photos').select('*').eq('project_id',id).order('phase').order('position')]);
 if(m.error||p.error){box.innerHTML='<div class="notice">Impossible de charger les détails. Vérifiez les migrations SQL.</div>';return}
 const photos=p.data||[],measurements=m.data||[];
 const imageRows=await Promise.all(photos.map(async photo=>{const {data}=await db.storage.from('atelier-project-photos').createSignedUrl(photo.storage_path,3600);return {...photo,url:data?.signedUrl||''}}));
 box.innerHTML='<h3>Mesures</h3><form class="form-grid" data-measure-form="'+id+'"><div class="field"><label>Nom de la mesure</label><input name="label" required placeholder="Ex. Largeur canapé"></div><div class="field"><label>Valeur</label><input name="value" type="number" min="0" step=".01" required></div><div class="field"><label>Unité</label><select name="unit"><option>cm</option><option>m</option><option>mm</option></select></div><div class="field"><label>Note</label><input name="notes"></div><div class="field full"><button class="btn primary">Ajouter la mesure</button></div></form><div class="muted">'+(measurements.map(x=>'<p>'+esc(x.label)+' : <b>'+esc(x.value)+' '+esc(x.unit)+'</b> '+esc(x.notes||'')+'</p>').join('')||'Aucune mesure enregistrée.')+'</div><hr style="border-color:var(--line);margin:18px 0"><h3>Photos avant / après</h3><p class="muted">Jusqu’à 4 photos par étape. JPG, PNG ou WebP — 10 Mo maximum par photo.</p><div class="form-grid"><div class="field"><label>Photos avant</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple data-photo-phase="before" data-project="'+id+'"></div><div class="field"><label>Photos après</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple data-photo-phase="after" data-project="'+id+'"></div></div><div class="list" style="margin-top:14px">'+imageRows.map(x=>x.url?'<div><img src="'+x.url+'" alt="Photo '+esc(x.phase)+'" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px"><p>'+ (x.phase==='before'?'Avant':'Après')+' · '+x.position+'/4</p></div>':'').join('')+'</div>';
 const mf=box.querySelector('[data-measure-form]');mf.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(mf));const {error}=await db.from('project_measurements').insert({project_id:id,label:v.label,value:Number(v.value),unit:v.unit,notes:v.notes||null});if(error)return toast('Erreur mesure : '+error.message);toast('Mesure ajoutée');await showProjectDetails(id)};
 box.querySelectorAll('[data-photo-phase]').forEach(input=>input.onchange=async()=>{const files=Array.from(input.files||[]);if(!files.length)return;const phase=input.dataset.photoPhase;const {data:existing,error:readError}=await db.from('project_photos').select('id,position').eq('project_id',id).eq('phase',phase);if(readError)return toast('Impossible de vérifier les photos existantes');if(existing.length+files.length>4)return toast('Maximum 4 photos pour chaque étape.');for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)return toast('Format non accepté ou photo supérieure à 10 Mo.');const used=new Set(existing.map(x=>x.position));let position=1;while(used.has(position))position++;const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=id+'/'+phase+'/'+crypto.randomUUID()+'.'+ext;const upload=await db.storage.from('atelier-project-photos').upload(path,file,{contentType:file.type,upsert:false});if(upload.error)return toast('Échec du téléversement : '+upload.error.message);const saved=await db.from('project_photos').insert({project_id:id,phase,position,storage_path:path});if(saved.error){await db.storage.from('atelier-project-photos').remove([path]);return toast('Photo envoyée mais métadonnées non enregistrées : '+saved.error.message)}existing.push({position});}toast('Photos enregistrées');await showProjectDetails(id)});
}
function printRows(rows){return rows.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+b+'</td></tr>').join('')}
function runPrint(){const paper=$('#paper');if(!paper||!paper.innerHTML.trim())return toast('Aucun document à imprimer.');if(typeof window.print!=='function')return toast('La fonction impression n’est pas disponible dans ce navigateur. Ouvrez le lien dans Chrome.');try{window.focus();window.print()}catch(error){console.error('Print failed:',error);toast('Impossible d’ouvrir l’impression. Essayez dans Chrome.')}}
function printProject(id){const p=projects.find(x=>x.id===id);if(!p)return;$('#paper').innerHTML='<div class="eyebrow">AHMED TAPISSERIE</div><h1>Fiche projet</h1><p>Document de suivi de l’atelier</p><table>'+printRows([['Client',esc(clientName(p.client_id))],['Service',esc(p.service)],['Statut',esc(statusLabels[p.status]||p.status)],['Date de réception',date(p.start_date)],['Livraison prévue',date(p.due_date)],['Notes',esc(p.notes||'—') ]])+'</table><div class="sign"><span>Signature du client</span><span>Signature de l’atelier</span></div>';runPrint()}
function clientDocumentHtml(c,p){return '<div style="font-family:Arial,sans-serif;color:#493522;background:#fff;padding:34px;width:760px;margin:auto"><div style="text-align:center;border-bottom:2px solid #bda47d;padding-bottom:18px"><div style="font-size:28px;font-weight:800;letter-spacing:2px">AHMED TAPISSERIE</div><div style="font-size:11px;color:#806644;margin-top:5px">TAPISSERIE · RÉNOVATION MOBILIER</div><h2 style="margin:20px 0 8px;font-size:21px">FICHE CLIENT</h2><div style="display:inline-block;background:#eee7da;padding:8px 15px;border-radius:20px;font-weight:bold">CLIENT N° '+clientNumber(c)+'</div></div><section style="background:#f4efe6;padding:18px;border-radius:10px;margin-top:20px"><h3 style="font-size:14px;margin:0 0 12px">INFORMATIONS CLIENT</h3><div style="font-size:18px;font-weight:bold">'+esc(c.name)+'</div><p>Téléphone : '+esc(c.phone||'—')+'</p><p>Adresse : '+esc(c.address||'—')+'</p></section><h3 style="font-size:14px;margin:22px 0 12px">DATES IMPORTANTES</h3><table style="width:100%;border-collapse:collapse"><tr><td style="padding:12px;border-bottom:1px solid #ddd">Récupération du salon</td><td style="padding:12px;border-bottom:1px solid #ddd;text-align:right;font-weight:bold">'+date(p.pickup_date)+' · '+esc(p.pickup_time||'—')+'</td></tr><tr><td style="padding:12px;border-bottom:1px solid #ddd">Salon disponible</td><td style="padding:12px;border-bottom:1px solid #ddd;text-align:right;font-weight:bold">'+date(p.due_date)+' · '+esc(p.ready_time||'—')+'</td></tr></table><h3 style="font-size:14px;margin:22px 0 12px">RÉCAPITULATIF FINANCIER</h3><table style="width:100%;border-collapse:collapse"><tr><td style="padding:12px">Prix total</td><td style="padding:12px;text-align:right;font-weight:bold">'+amount(p.final_price)+'</td></tr><tr><td style="padding:12px">Avance reçue</td><td style="padding:12px;text-align:right;font-weight:bold">'+amount(p.deposit)+'</td></tr></table><div style="margin-top:12px;background:#eee7da;padding:18px;border-radius:10px"><div style="font-size:11px;color:#70532f;font-weight:bold">RESTE À PAYER</div><div style="font-size:27px;font-weight:800;margin-top:6px">'+amount(Number(p.final_price)-Number(p.deposit))+'</div></div><div style="text-align:center;border-top:1px solid #bda47d;margin-top:28px;padding-top:20px;font-size:16px;font-weight:bold">Merci pour votre confiance !</div><div style="text-align:center;color:#806644;font-size:11px;margin-top:6px">AHMED TAPISSERIE</div></div>'}
function getClientAndProject(id){const c=clients.find(x=>x.id===id);if(!c)return null;const p=projects.filter(x=>x.client_id===id).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))[0];return p?{c,p}:null}
function pdfOptions(c){return {margin:8,filename:'Fiche_Client_'+clientNumber(c)+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}}
function makePdfElement(html){const host=document.createElement('div');host.style.position='fixed';host.style.left='-10000px';host.style.top='0';host.style.width='760px';host.innerHTML=html;document.body.appendChild(host);return host}
async function downloadClientPdf(id){const found=getClientAndProject(id);if(!found)return toast('Aucune commande associée à ce client.');if(typeof html2pdf==='undefined')return toast('Le module PDF est indisponible. Vérifiez votre connexion.');const host=makePdfElement(clientDocumentHtml(found.c,found.p));try{await html2pdf().set(pdfOptions(found.c)).from(host.firstElementChild).save();toast('PDF téléchargé. Vous pouvez le partager sur WhatsApp.')}catch(error){console.error(error);toast('Échec de création du PDF. Réessayez.')}finally{host.remove()}}
async function shareClientPdf(id){const found=getClientAndProject(id);if(!found)return toast('Aucune commande associée à ce client.');if(typeof html2pdf==='undefined')return toast('Le module PDF est indisponible. Téléchargez le PDF puis partagez-le manuellement.');const host=makePdfElement(clientDocumentHtml(found.c,found.p));try{const pdf=await html2pdf().set(pdfOptions(found.c)).from(host.firstElementChild).toPdf().get('pdf');const blob=pdf.output('blob');const file=new File([blob],'Fiche_Client_'+clientNumber(found.c)+'.pdf',{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Fiche client N° '+clientNumber(found.c),text:'Voici votre fiche client et les dates convenues — Ahmed Tapisserie.'})}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);window.open('https://wa.me/?text='+encodeURIComponent('Bonjour, voici votre fiche client N° '+clientNumber(found.c)+'. Joignez le PDF téléchargé à cette conversation.'),'_blank','noopener');toast('PDF téléchargé. Joignez-le dans WhatsApp.')}}catch(error){if(error?.name!=='AbortError'){console.error(error);toast('Impossible de préparer le PDF. Réessayez.')}}finally{host.remove()}}
function printClient(id){const found=getClientAndProject(id);if(!found)return toast('Aucune commande associée à ce client.');$('#paper').innerHTML=clientDocumentHtml(found.c,found.p);runPrint()}
function printAppointment(id){const a=appointments.find(x=>x.id===id);if(!a)return;$('#paper').innerHTML='<div class="eyebrow">AHMED TAPISSERIE</div><h1>Fiche de rendez-vous</h1><table>'+printRows([['Client',esc(clientName(a.client_id))],['Date',date(a.appointment_date)],['Heure',esc(a.appointment_time||'—')],['Estimation',amount(a.estimated_amount)],['Notes',esc(a.notes||'—') ]])+'</table><div class="sign"><span>Signature du client</span><span>Signature de l’atelier</span></div>'}
if(CONFIGURED)db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){session=null;$('#app').classList.add('hidden');authView()}});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(error=>console.error('Service worker registration failed:',error)));
}
boot();
</script>
