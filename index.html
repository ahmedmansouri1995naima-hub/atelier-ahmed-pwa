/* Mobile app interaction: prevent accidental text-selection bubbles */

 -webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none;
}
input,textarea,select,[contenteditable="true"],[contenteditable=""],.selectable-text{
 -webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default;
}

function confirmAction({title,name,message,confirmLabel,tone='primary'}){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='app-confirm-backdrop';overlay.innerHTML='<section class="app-confirm" role="dialog" aria-modal="true" aria-labelledby="app-confirm-title"><div class="app-confirm-icon '+(tone==='danger'?'danger':'')+'">'+(tone==='danger'?'!':'✓')+'</div><div class="eyebrow">AHMED TAPISSERIE</div><h2 id="app-confirm-title">'+esc(title)+'</h2><div class="app-confirm-name">'+esc(name||'')+'</div><p>'+esc(message)+'</p><div class="app-confirm-actions"><button type="button" class="btn" data-confirm-cancel>Annuler</button><button type="button" class="btn '+(tone==='danger'?'danger':'primary')+'" data-confirm-ok>'+esc(confirmLabel)+'</button></div></section>';document.body.appendChild(overlay);const finish=value=>{overlay.remove();document.removeEventListener('keydown',key);resolve(value)};const key=e=>{if(e.key==='Escape')finish(false)};overlay.addEventListener('click',e=>{if(e.target===overlay)finish(false)});overlay.querySelector('[data-confirm-cancel]').onclick=()=>finish(false);overlay.querySelector('[data-confirm-ok]').onclick=()=>finish(true);document.addEventListener('keydown',key);overlay.querySelector('[data-confirm-cancel]').focus()})}

function wire(){
 const uf=$('#unified-client-form');
 if(uf){const sourceInput=uf.querySelector('[name="source"]');uf.querySelectorAll('[data-source-choice]').forEach(b=>b.onclick=()=>{sourceInput.value=b.dataset.sourceChoice;uf.querySelectorAll('[data-source-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')})});const existing=uf.querySelector('[name="existing_client_id"]');existing.onchange=()=>{const c=clients.find(x=>x.id===existing.value);if(!c)return;uf.elements.name.value=c.name||'';uf.elements.phone.value=c.phone||'';uf.elements.address.value=c.address||'';uf.elements.email.value=c.email||'';};}
 if(uf)uf.onsubmit=async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(uf));
  const price=Number(f.final_price),deposit=Number(f.deposit||0);
  if(!Number.isFinite(price)||price<0||!Number.isFinite(deposit)||deposit<0||deposit>price)return toast('Vérifiez le prix et l’acompte.');
  if(f.ready_date<f.collection_date)return toast('La date de disponibilité doit être après la récupération.');
  let clientId=f.existing_client_id;
  if(clientId){
   const {error}=await db.from('clients').update({name:f.name,phone:f.phone||null,address:f.address||null,email:f.email||null}).eq('id',clientId);
   if(error)return toast('Erreur client : '+error.message);
  }else{
   const {data,error}=await db.from('clients').insert({name:f.name,phone:f.phone||null,address:f.address||null,email:f.email||null,source:f.source||null}).select('id').single();
   if(error)return toast('Erreur client : '+error.message);clientId=data.id;
  }
  const {error:projectError}=await db.from('projects').insert({
   client_id:clientId,service:f.service,start_date:f.collection_date,due_date:f.ready_date,
   collection_date:f.collection_date,collection_time:f.collection_time||null,
   ready_date:f.ready_date,ready_time:f.ready_time||null,
   reception_type:f.reception_type,final_price:price,deposit:deposit,status:'pending',notes:f.notes||null
  });
  if(projectError)return toast('Le client est enregistré, mais le dossier n’a pas été créé : '+projectError.message);
  toast('Client et dossier enregistrés');query='';await reload();view();
 };
const search=$('#search');if(search)search.oninput=()=>{query=search.value;const pos=search.selectionStart;view();const n=$('#search');n.focus();n.setSelectionRange(pos,pos)};
const statusSelect=$('#status-filter');if(statusSelect)statusSelect.onchange=()=>{statusFilter=statusSelect.value;view()};
document.querySelectorAll('[data-appointment-start]').forEach(b=>b.onclick=async()=>{const a=appointments.find(x=>x.id===b.dataset.appointmentStart);if(!a)return;if(!await confirmAction({title:'Démarrer ce projet ?',name:clientName(a.client_id),message:'Le rendez-vous sera converti en projet avec le statut « En attente ». Vous pourrez ensuite choisir les quatre états de suivi.',confirmLabel:'Créer le projet',tone:'primary'}))return;const {data,error}=await db.from('projects').insert({client_id:a.client_id,service:'Travail à définir',start_date:a.appointment_date,collection_date:a.appointment_date,final_price:Number(a.estimated_amount||0),deposit:0,status:'pending',notes:a.notes||null}).select('id').single();if(error)return toast('Création du projet impossible : '+error.message);const {error:linkError}=await db.from('appointments').update({converted_project_id:data.id,converted_at:new Date().toISOString()}).eq('id',a.id);if(linkError)return toast('Projet créé, mais liaison du rendez-vous impossible : '+linkError.message);await reload();active='appointments';render();toast('Projet créé en attente.');});document.querySelectorAll('[data-appointment-status]').forEach(sel=>sel.onchange=async()=>{const {error}=await db.from('projects').update({status:sel.value}).eq('id',sel.dataset.appointmentStatus);if(error)return toast('Mise à jour impossible : '+error.message);await reload();render();toast('Statut du projet mis à jour.');});
document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('projects').update({status:s.value}).eq('id',s.dataset.status);if(error)return toast('Mise à jour impossible : '+error.message);await reload();view();toast('Statut mis à jour')});
document.querySelectorAll('[data-archive-client]').forEach(b=>b.onclick=async()=>{const c=clients.find(x=>x.id===b.dataset.archiveClient);if(!c)return;if(!await confirmAction({title:'Archiver ce client ?',name:c.name,message:'Le dossier sera déplacé vers les clients archivés. Tous ses projets, rendez-vous, photos et montants resteront conservés.',confirmLabel:'Archiver le client',tone:'danger'}))return;const {error}=await db.from('clients').update({archived_at:new Date().toISOString()}).eq('id',c.id);if(error)return toast('Archivage impossible : '+error.message);await reload();active='clients';render();toast('Client archivé. Ses données sont conservées.');});document.querySelectorAll('[data-restore-client]').forEach(b=>b.onclick=async()=>{const c=clients.find(x=>x.id===b.dataset.restoreClient);if(!c)return;if(!await confirmAction({title:'Restaurer ce client ?',name:c.name,message:'Le client retrouvera sa place dans la liste active. Son historique sera conservé.',confirmLabel:'Restaurer le client',tone:'primary'}))return;const {error}=await db.from('clients').update({archived_at:null}).eq('id',c.id);if(error)return toast('Restauration impossible : '+error.message);await reload();active='archive';render();toast('Client restauré.');});
 document.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>showProjectDetails(b.dataset.details));
document.querySelectorAll('[data-print-project]').forEach(b=>b.onclick=()=>printProject(b.dataset.printProject));
document.querySelectorAll('[data-print-client]').forEach(b=>b.onclick=()=>printClientFiche(b.dataset.printClient));
document.querySelectorAll('[data-print-appointment]').forEach(b=>b.onclick=()=>printAppointment(b.dataset.printAppointment));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{active=b.dataset.go;render()});
}

async function showProjectDetails(id){
 const box=$('#details-'+id);if(!box)return;box.classList.remove('hidden');
 const [m,p]=await Promise.all([db.from('project_measurements').select('*').eq('project_id',id).order('created_at'),db.from('project_photos').select('*').eq('project_id',id).order('phase').order('position')]);
 if(m.error||p.error){box.innerHTML='<div class="notice">Impossible de charger les détails. Vérifiez les migrations SQL.</div>';return}
 const photos=p.data||[],measurements=m.data||[];
 const imageRows=await Promise.all(photos.map(async photo=>{const {data}=await db.storage.from('atelier-project-photos').createSignedUrl(photo.storage_path,3600);return {...photo,url:data?.signedUrl||''}}));
 box.innerHTML='<h3>Mesures</h3><form class="form-grid" data-measure-form="'+id+'"><div class="field"><label>Nom de la mesure</label><input name="label" required placeholder="Ex. Largeur canapé"></div><div class="field"><label>Valeur</label><input name="value" type="number" min="0" step=".01" required></div><div class="field"><label>Unité</label><select name="unit"><option>cm</option><option>m</option><option>mm</option></select></div><div class="field"><label>Note</label><input name="notes"></div><div class="field full"><button class="btn primary">Ajouter la mesure</button></div></form><div class="muted">'+(measurements.map(x=>'<p>'+esc(x.label)+' : <b>'+esc(x.value)+' '+esc(x.unit)+'</b> '+esc(x.notes||'')+'</p>').join('')||'Aucune mesure enregistrée.')+'</div><hr style="border-color:var(--line);margin:18px 0"><h3>Photos avant / après</h3><p class="muted">Jusqu’à 4 photos par étape. JPG, PNG ou WebP — 10 Mo maximum par photo.</p><div class="form-grid"><div class="field"><label>Photos avant</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple data-photo-phase="before" data-project="'+id+'"></div><div class="field"><label>Photos après</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple data-photo-phase="after" data-project="'+id+'"></div></div><div class="list" style="margin-top:14px">'+imageRows.map(x=>x.url?'<div><img src="'+x.url+'" alt="Photo '+esc(x.phase)+'" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px"><p>'+ (x.phase==='before'?'Avant':'Après')+' · '+x.position+'/4</p></div>':'').join('')+'</div>';
 const mf=box.querySelector('[data-measure-form]');mf.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(mf));const {error}=await db.from('project_measurements').insert({project_id:id,label:v.label,value:Number(v.value),unit:v.unit,notes:v.notes||null});if(error)return toast('Erreur mesure : '+error.message);toast('Mesure ajoutée');await showProjectDetails(id)};
 box.querySelectorAll('[data-photo-phase]').forEach(input=>input.onchange=async()=>{const files=Array.from(input.files||[]);if(!files.length)return;const phase=input.dataset.photoPhase;const {data:existing,error:readError}=await db.from('project_photos').select('id,position').eq('project_id',id).eq('phase',phase);if(readError)return toast('Impossible de vérifier les photos existantes');if(existing.length+files.length>4)return toast('Maximum 4 photos pour chaque étape.');for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)return toast('Format non accepté ou photo supérieure à 10 Mo.');const used=new Set(existing.map(x=>x.position));let position=1;while(used.has(position))position++;const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=id+'/'+phase+'/'+crypto.randomUUID()+'.'+ext;const upload=await db.storage.from('atelier-project-photos').upload(path,file,{contentType:file.type,upsert:false});if(upload.error)return toast('Échec du téléversement : '+upload.error.message);const saved=await db.from('project_photos').insert({project_id:id,phase,position,storage_path:path});if(saved.error){await db.storage.from('atelier-project-photos').remove([path]);return toast('Photo envoyée mais métadonnées non enregistrées : '+saved.error.message)}existing.push({position});}toast('Photos enregistrées');await showProjectDetails(id)});
}
function printRows(rows){return rows.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+b+'</td></tr>').join('')}
function runPrint(){const paper=$('#paper');if(!paper||!paper.innerHTML.trim())return toast('Aucun document à imprimer.');if(typeof window.print!=='function')return toast('La fonction impression n’est pas disponible dans ce navigateur. Ouvrez le lien dans Chrome.');try{window.focus();window.print()}catch(error){console.error('Print failed:',error);toast('Impossible d’ouvrir l’impression. Essayez dans Chrome.')}}
function printClientFiche(id){
 const p=projects.find(x=>x.id===id);if(!p)return;
 const c=clients.find(x=>x.id===p.client_id)||{};
 const balance=Math.max(0,Number(p.final_price||0)-Number(p.deposit||0));
 const timeValue=v=>v?String(v).slice(0,5):'À préciser';
 $('#paper').innerHTML='<article class="client-print">'+
 '<header class="client-print-head"><div><div class="client-print-brand">AHMED TAPISSERIE</div><div class="client-print-sub">ATELIER DE TAPISSERIE · DOCUMENT CLIENT</div></div><div class="client-print-number">N° '+String(c.client_number||'—').padStart(3,'0')+'</div></header>'+
 '<div class="client-print-title"><div class="client-print-kicker">VOTRE COMMANDE</div><h1>Rendez-vous</h1><p>Confirmation des dates, du travail demandé et des conditions convenues</p></div>'+
 '<section class="client-print-section"><h2><span>01</span> Informations du client</h2><table><tbody>'+printRows([['Nom et prénom',esc(c.name)],['Téléphone',esc(c.phone||'—')],['Adresse',esc(c.address||'—')]])+'</tbody></table></section>'+
 '<section class="client-print-section"><h2><span>02</span> Dates importantes</h2><table><tbody>'+printRows([['Récupération du salon',date(p.collection_date||p.start_date)+' · '+timeValue(p.collection_time)],['Salon prêt à récupérer',date(p.ready_date||p.due_date)+' · '+timeValue(p.ready_time)]])+'</tbody></table></section>'+
 '<section class="client-print-section"><h2><span>03</span> Détails et règlement</h2><table><tbody>'+printRows([['Travail demandé',esc(p.service||'—')],['Prix convenu',amount(p.final_price)],['Avance versée',amount(p.deposit)],['Reste à payer',amount(balance)]])+'</tbody></table></section>'+
 '<div class="client-print-balance"><span>RESTE À PAYER</span><strong>'+amount(balance)+'</strong></div>'+
 '<div class="client-print-signatures"><div><span>Signature du client</span><i></i></div><div><span>Signature de l’atelier</span><i></i></div></div>'+
 '<footer class="client-print-footer">Merci de votre confiance · Ahmed Tapisserie</footer></article>';
 runPrint();
}
function printProject(id){const p=projects.find(x=>x.id===id);if(!p)return;$('#paper').innerHTML='<div class="eyebrow">AHMED TAPISSERIE</div><h1>Fiche atelier</h1><p>Document interne de suivi</p><table>'+printRows([['Client',esc(clientName(p.client_id))],['Service',esc(p.service)],['Statut',esc(statusLabels[p.status]||p.status)],['Récupération',date(p.collection_date||p.start_date)],['Disponibilité',date(p.ready_date||p.due_date)],['Notes internes',esc(p.notes||'—') ]])+'</table><div class="sign"><span>Suivi atelier</span><span>Ahmed Tapisserie</span></div>';runPrint()}
function printAppointment(id){const a=appointments.find(x=>x.id===id);if(!a)return;$('#paper').innerHTML='<div class="eyebrow">AHMED TAPISSERIE</div><h1>Fiche de rendez-vous</h1><table>'+printRows([['Client',esc(clientName(a.client_id))],['Date',date(a.appointment_date)],['Heure',esc(a.appointment_time||'—')],['Estimation',amount(a.estimated_amount)],['Notes',esc(a.notes||'—') ]])+'</table><div class="sign"><span>Signature du client</span><span>Signature de l’atelier</span></div>';runPrint()}
document.addEventListener('contextmenu',e=>{const t=e.target;if(t&&t.closest('input,textarea,select,[contenteditable="true"],[contenteditable=""]'))return;e.preventDefault()});
if(CONFIGURED)db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){session=null;$('#app').classList.add('hidden');authView()}});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(error=>console.error('Service worker registration failed:',error)));
}
boot();
</script>
</body>
</html>
