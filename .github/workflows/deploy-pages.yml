name: Deploy Atelier Ahmed PWA

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Supabase configuration
        run: |
          if grep -q "YOUR_SUPABASE_PROJECT_URL\|YOUR_SUPABASE_PUBLISHABLE_KEY" index.html; then
            echo "Supabase configuration is not connected yet."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public app files only
        run: |
          mkdir site
          cp index.html manifest.webmanifest service-worker.js icon.svg site/

      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
